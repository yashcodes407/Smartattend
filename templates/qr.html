{% extends "base.html" %}{% block content %}<section class="card center qrpage"><p class="eyebrow">STUDENT QR CODE</p><h1>{{ student.name }}</h1><p class="muted">Roll: {{ student.roll }} · {{ student.class_name }}</p><img class="qr" src="{{ url_for('qr_png', student_id=student.id) }}" alt="Student QR Code"><p>Show this QR code to the teacher's scanner.</p><a class="btn" href="{{ url_for('qr_png', student_id=student.id) }}">Download QR PNG</a><p><a href="{{ url_for('students') }}">← Back to Students</a></p></section>{% endblock %}
